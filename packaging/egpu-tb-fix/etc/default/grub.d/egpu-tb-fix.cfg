# egpu-tb-fix: estabilidad del enlace Thunderbolt/USB4 con la eGPU. Va en la línea de
# comandos del kernel porque el módulo thunderbolt se carga desde el initramfs
# (MODULES=most), antes de montar la raíz, y no ve /usr/lib/modprobe.d del sistema.
#
# host_reset=0: no reiniciar el router USB4 al cargar el driver. Desde el kernel 6.8.8 el
#   reinicio desmonta los túneles que dejó la BIOS y la eGPU NVIDIA "se cae del bus" al
#   arrancar (regresión del commit 59a54c5f3dbd; el workaround conocido es este parámetro).
# clx=0: sin estados de bajo consumo CLx en los enlaces USB4. Con esta caja fallan
#   ("failed to enable CL states") y coinciden con caídas del enlace.
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} thunderbolt.host_reset=0 thunderbolt.clx=0"
