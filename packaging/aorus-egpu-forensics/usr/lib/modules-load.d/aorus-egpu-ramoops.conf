# aorus-egpu-forensics — cargar ramoops explícitamente. SÍ hace falta.
#
# POR QUÉ: en este kernel ramoops es un MÓDULO (CONFIG_PSTORE_RAM=m) y su único
# alias de autocarga es de Device Tree ("of:N*T*Cramoops", visible en
# `modinfo ramoops`). En una máquina x86/ACPI ese alias no coincide nunca, así
# que NADIE lo carga: ni udev, ni systemd, ni el initramfs. Verificado en vivo —
# /sys/fs/pstore está montado y vacío, y `lsmod | grep ramoops` no devuelve
# nada, aunque el sistema lleva meses arrancando.
#
# Sin esta línea, la reserva de RAM de 97-aorus-egpu-forensics.cfg se haría
# igual y no serviría para nada.
#
# reed_solomon (la dependencia de ramoops, necesaria para ramoops.ecc=1) NO hace
# falta listarla: modprobe resuelve dependencias.
#
# Los parámetros (mem_name, record_size, ecc, max_reason) NO van aquí: viajan en
# la línea de comandos del kernel como ramoops.<param>=<valor>, que es donde
# tienen que estar para que el módulo los vea al cargarse.
#
# Momento de carga: systemd-modules-load.service, antes de sysinit.target. Es
# pronto, pero no es el arranque temprano: un panic ANTES de ese punto no se
# grabaría. Meter ramoops en el initramfs lo adelantaría; no se hace porque
# nuestros cuelgues ocurren probando la eGPU, muy después del arranque, y porque
# tocar el initramfs es un cambio bastante menos reversible.
ramoops
