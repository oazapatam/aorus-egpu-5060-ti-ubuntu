# aorus-egpu-forensics — CAPA 3 (parte 2): convertir el CUELGUE en un PANIC.
# Lo gestiona el .deb aorus-egpu-forensics. NO lo edites a mano.
#
#   Desactivar sin desinstalar nada, en caliente (vuelve al comportamiento
#   original de Ubuntu: ante un lockup el equipo se queda congelado, no se
#   reinicia):
#       sudo sysctl -w kernel.softlockup_panic=0
#       sudo sysctl -w kernel.hardlockup_panic=0
#       sudo sysctl -w kernel.panic_on_rcu_stall=0
#
#   Desactivar de forma permanente:
#       sudo mv /etc/sysctl.d/60-aorus-egpu-lockup.conf{,.disabled}
#   Revertir todo el paquete:
#       sudo apt remove aorus-egpu-forensics   (el postrm ya pone los _panic a 0)
#
# ------------------------------------------------------------------------------
# POR QUÉ HACE FALTA ESTO (es el punto central de todo el diseño)
#
# ramoops NO graba de forma continua. Solo escribe cuando el kernel dispara un
# kmsg_dump, y eso pasa en panic / oops / reinicio de emergencia. La grabación
# continua la daría CONFIG_PSTORE_CONSOLE, y este kernel NO la trae
# (verificado: "# CONFIG_PSTORE_CONSOLE is not set" en /boot/config-7.0.0-1015-oem,
# y no hay símbolos pstore_register_console en /proc/kallsyms).
#
# Consecuencia: un cuelgue duro SIN panic — que es exactamente lo documentado en
# este repo para los incidentes anteriores: sin Xid, sin panic, sin oops — no
# deja NADA en pstore, por mucha RAM que se haya reservado.
#
# La vía para salir de ahí es hacer que el detector de lockups del kernel, que
# sí sigue vivo durante el cuelgue, convierta ese cuelgue en un panic. Entonces
# el panic dispara el kmsg_dump, y ENTONCES ramoops graba.
#
# LÍMITE QUE QUEDA, dicho claro: si el cuelgue es tan duro que el propio
# detector no corre (el NMI no llega, el bus se lleva la máquina entera, el
# firmware se queda clavado), no habrá panic ni volcado. Para ESE caso la red de
# seguridad son las capas 1 y 2: las migas de pan escritas en disco con fsync
# ANTES de cada paso (src/adapters/trace/durable.sh, vía aorus-egpu-probe), que
# no dependen de que el kernel sobreviva. Si hiciera falta más, el siguiente
# escalón es netconsole a otra máquina (CONFIG_NETCONSOLE=m está disponible);
# ver docs/freeze-forensics.md.
# ------------------------------------------------------------------------------

# --- Detector de lockups: encendido y con qué ventana ------------------------

# Watchdog de softlockup encendido (es el default de Ubuntu; se fija explícito
# para que no dependa de otro fichero de sysctl.d).
kernel.watchdog = 1

# Watchdog por NMI = detector de HARDlockup. Imprescindible: es el único que
# puede hablar cuando la CPU está en un bucle con las interrupciones apagadas,
# que es la forma que suele tener un cuelgue por bus/MMIO.
# Este kernel lo trae por perf (CONFIG_HARDLOCKUP_DETECTOR_PERF=y), así que
# consume de forma permanente un contador del PMU. Coste aceptable.
kernel.nmi_watchdog = 1

# Ventana del watchdog, en segundos. Se deja en el DEFAULT (10) a propósito:
#   - hardlockup: salta si una CPU no atiende interrupciones en ~10 s.
#   - softlockup: el umbral es 2*watchdog_thresh, o sea ~20 s.
# No se baja porque un cuelgue de verdad es permanente: 10 s siempre se cumplen,
# y bajar el umbral solo añade FALSOS POSITIVOS, que aquí son especialmente
# probables: la inicialización del driver nvidia, un reentreno del enlace PCIe o
# la recuperación de AER sobre un enlace Thunderbolt marginal pueden tener
# tramos largos sin atender interrupciones. Un falso positivo con panic = 1
# significa un reinicio gratis en mitad de una prueba.
# Si en una sesión concreta quieres reaccionar antes (y aceptas ese riesgo),
# bájalo SOLO durante la prueba y vuelve a subirlo:
#       sudo sysctl -w kernel.watchdog_thresh=5    # hard ~5 s, soft ~10 s
#       sudo sysctl -w kernel.watchdog_thresh=10
kernel.watchdog_thresh = 10

# --- Lockup -> panic ---------------------------------------------------------
#
# RIESGO, explícito: con esto el equipo YA NO SE QUEDA CONGELADO ante un lockup;
# hace panic y (por kernel.panic, más abajo) se REINICIA SOLO. Es justo lo que
# queremos — un reinicio controlado es la única forma de que el volcado llegue a
# pstore —, pero significa reinicios automáticos, con pérdida de lo que no esté
# guardado. Si estás trabajando con algo sin guardar, desactívalo en caliente
# con los tres `sysctl -w ... = 0` de la cabecera de este fichero.

# Hardlockup (CPU en bucle sin interrupciones) -> panic.
kernel.hardlockup_panic = 1

# Softlockup (CPU en bucle en modo kernel sin ceder, >= 2*watchdog_thresh) -> panic.
kernel.softlockup_panic = 1

# Stall de RCU -> panic. Cubre el hueco entre los dos de arriba: una CPU clavada
# con interrupciones ABIERTAS puede no disparar ninguno de los dos y aun así
# dejar el sistema inservible. El timeout de RCU es de ~21 s por defecto.
kernel.panic_on_rcu_stall = 1

# Oops -> panic. Ya es el default en Ubuntu (= 1); se fija explícito porque sin
# él un oops dejaría el sistema medio vivo y SIN kmsg_dump de panic.
kernel.panic_on_oops = 1

# --- Qué se imprime antes de morir (eso es lo que acaba en ramoops) ----------

# Backtrace de TODAS las CPUs, no solo de la que detectó el lockup. Con un
# cuelgue por bus la CPU culpable casi nunca es la que avisa. Es el dato más
# valioso del volcado, y la razón de record_size=256K y kmsg_bytes=256K en
# 97-aorus-egpu-forensics.cfg (24 CPUs ocupan sitio).
kernel.hardlockup_all_cpu_backtrace = 1
kernel.softlockup_all_cpu_backtrace = 1

# Escrituras a /dev/kmsg sin rate limit. Las migas de pan de la capa 1 se
# escriben también en /dev/kmsg precisamente para que viajen DENTRO del volcado
# de ramoops; con el rate limit por defecto ("ratelimit") se perderían algunas
# justo cuando más importan.
# Nota: si alguien pone printk.devkmsg= en la línea de comandos del kernel, este
# sysctl pasa a ser de solo lectura y systemd-sysctl avisará al aplicarlo. No
# rompe nada.
kernel.printk_devkmsg = on

# --- Reinicio automático tras el panic ---------------------------------------
#
# Segundos de espera entre el panic y el reinicio. POR QUÉ IMPORTA PARA EL
# FORENSE, y no es obvio:
#   - Un REINICIO (warm reboot), que es lo que hace esto, NO corta la
#     alimentación: el contenido de la DRAM se mantiene, y con él la región de
#     ramoops. El volcado sobrevive.
#   - Un CORTE DE CORRIENTE no: mantener pulsado el botón de encendido, quitar
#     el cargador con la batería agotada o un apagado forzado vacían la DRAM en
#     cuestión de instantes, y el volcado se pierde AUNQUE el panic haya
#     grabado. Por eso interesa que el reinicio lo haga el kernel, no el dedo.
#   - Si la máquina se queda congelada y el panic nunca llega, el reinicio
#     "bueno" es SysRq (Alt+SysRq+b, o antes Alt+SysRq+c para forzar el panic):
#     también es warm reboot. Ver docs/freeze-forensics.md.
# 20 s es un término medio: da tiempo a fotografiar la pantalla si el panic se ve
# (sin splash) y no deja el equipo colgado esperando. El default de Ubuntu es 10.
kernel.panic = 20

# --- SysRq: el salvavidas manual --------------------------------------------
#
# 184 = 0xB8 = 176 (lo que trae Ubuntu en /usr/lib/sysctl.d/55-magic-sysrq.conf:
# SYNC 0x10 | REMOUNT 0x20 | BOOT 0x80) + DUMP 0x8.
# El bit DUMP es lo que habilita, DESDE EL TECLADO durante un cuelgue:
#   Alt+SysRq+l   backtrace de todas las CPUs activas -> al buffer del kernel
#   Alt+SysRq+t   estado de todas las tareas
#   Alt+SysRq+c   provocar un panic a propósito -> dispara el volcado de ramoops
# La secuencia útil cuando la máquina está congelada pero el teclado responde es
# l y luego c: primero metes los backtraces en el buffer, después fuerzas el
# panic que los graba.
# RIESGO: cualquiera con acceso físico al teclado puede tirar la máquina con
# Alt+SysRq+c. Es el precio del salvavidas. Para volver al valor de Ubuntu:
#       sudo sysctl -w kernel.sysrq=176
# (Nota: `echo c > /proc/sysrq-trigger` como root funciona SIEMPRE, incluso con
# el bit DUMP apagado — la ruta de /proc no consulta esta máscara. La máscara
# solo manda en el teclado.)
kernel.sysrq = 184

# --- Opcionales, apagados a propósito ---------------------------------------
#
# Tareas bloqueadas en D durante kernel.hung_task_timeout_secs (120 s) -> panic.
# Cubre el síntoma "nvidia-smi se queda clavado para siempre pero el resto del
# equipo responde". NO se activa por defecto porque dispara con I/O lenta
# legítima (suspensión, disco cifrado bajo carga) y eso serían reinicios
# gratuitos. Actívalo solo para cazar ese síntoma concreto:
#       sudo sysctl -w kernel.hung_task_panic=1
#
# NMI de I/O (error de bus señalizado por el chipset) -> panic:
#       sudo sysctl -w kernel.panic_on_io_nmi=1
#
# Volcar además tareas/memoria/temporizadores en el panic (máscara de bits).
# CUIDADO: su salida es enorme y puede empujar fuera de los 256 KiB capturados
# justo las líneas interesantes. Úsalo solo si el volcado sale pobre:
#       sudo sysctl -w kernel.panic_print=0x1f
