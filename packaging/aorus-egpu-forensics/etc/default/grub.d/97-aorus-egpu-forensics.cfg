# aorus-egpu-forensics — CAPA 3: que el dmesg del kernel SOBREVIVA al reinicio.
# Lo gestiona el .deb aorus-egpu-forensics. NO lo edites a mano.
# Revertir todo:  sudo apt remove aorus-egpu-forensics && sudo reboot
#
# El prefijo 97- hace que este fichero se lea DESPUÉS de egpu-tb-fix.cfg (que no
# lleva prefijo numérico y por tanto va antes en el orden de shell glob que usa
# /etc/grub.d/10_linux). Por eso la línea de abajo arranca con
# ${GRUB_CMDLINE_LINUX_DEFAULT}: así se AÑADE a lo que ya pusieron egpu-tb-fix
# (thunderbolt.host_reset=0 thunderbolt.clx=0) y el default de Ubuntu
# (quiet splash), en vez de pisarlos.
#
# PROBLEMA QUE RESUELVE: el cuelgue al probar la eGPU no deja rastro porque el
# buffer de dmesg vive en RAM volátil y journald nunca llega a vaciarlo a disco.
# ramoops reserva un trozo de RAM que NO se limpia al reiniciar y el kernel
# escribe ahí su log cuando hay un kmsg_dump (panic / oops). Al volver a
# arrancar, el log aparece en /sys/fs/pstore/dmesg-ramoops-N.
#
# ------------------------------------------------------------------------------
# reserve_mem=16M:4096:aorusoops
#     Reserva 16 MiB de RAM física, alineados a 4096 bytes, con la etiqueta
#     "aorusoops". Formato documentado: reserve_mem=nn[KMG]:<align>:<label>
#     (Documentation/admin-guide/kernel-parameters.txt; opción añadida en v6.12,
#     commit 1e4c64b71c9b de mm/memblock.c).
#     Se usa ESTO y no una dirección física fija (memmap= + ramoops.mem_address=)
#     porque la dirección fija hay que acertarla contra el mapa de memoria real
#     de la máquina: si se solapa con algo del firmware, el arranque se rompe o
#     se corrompe memoria de otro. reserve_mem deja que el kernel elija y le pone
#     nombre, y ramoops lo busca por nombre.
#     VERIFICADO en esta máquina: el kernel 7.0.0-1015-oem exporta
#     reserve_mem_find_by_name / reserve_mem_release_by_name en /proc/kallsyms,
#     y el módulo ramoops de este kernel referencia reserve_mem_find_by_name
#     (strings del .ko) y acepta el parámetro mem_name (modinfo -p ramoops).
#     16 MiB de 64 GiB es ruido; el límite real es que mem_size debe ser potencia
#     de dos, y 16M lo es.
#     LIMITACIÓN HONESTA (la dice la propia doc del kernel): reserve_mem es
#     "best effort" — no garantiza caer en la MISMA dirección física en cada
#     arranque. Si cambia, el contenido del arranque anterior se pierde (ramoops
#     no encontrará su cabecera y empezará de cero). Hay que comprobarlo en vivo
#     una vez: ver docs/freeze-forensics.md, sección "validar la cadena".
#
# ramoops.mem_name=aorusoops
#     Le dice a ramoops que use la región reservada con esa etiqueta, en vez de
#     mem_address/mem_size numéricos. Si no la encuentra NO avisa con un mensaje
#     propio: se queda sin memoria y falla con "The memory size and the
#     record/console size must be non-zero". Por eso el primer sitio donde mirar
#     siempre es `sudo dmesg | grep -i ramoops`.
#
# ramoops.record_size=262144
#     256 KiB por registro. Cada kmsg_dump escribe uno (o varios) registros.
#     16 MiB / 256 KiB = 64 registros: espacio para varios cuelgues seguidos.
#     256 KiB porque esta máquina tiene 24 CPUs y un backtrace de todas ellas
#     (SysRq-l, o hardlockup_all_cpu_backtrace=1) ocupa decenas de KiB.
#
# ramoops.max_reason=3
#     Qué motivos de volcado se graban, según enum kmsg_dump_reason:
#     1=PANIC, 2=OOPS, 3=EMERG, 4=SHUTDOWN. El default de ramoops es 2
#     (oops+panic). Subimos a 3 para incluir EMERG (reinicio de emergencia).
#     NO ponemos 4: grabaría un registro en CADA apagado limpio y llenaría el
#     archivo de ruido. Para VALIDAR la cadena sin provocar un panic se puede
#     poner 4 temporalmente editando la entrada de GRUB con `e` en el arranque
#     (ver docs/freeze-forensics.md).
#
# ramoops.ecc=1
#     ECC software (16 bytes de paridad Reed-Solomon por bloque). La doc del
#     kernel lo recomienda justo para nuestro caso: RAM que se lee tras un
#     reinicio por hardware, donde puede haber bits volteados pero el dato suele
#     ser recuperable. Arrastra el módulo reed_solomon (dependencia de ramoops).
#
# pstore.backend=ramoops
#     IMPRESCINDIBLE EN ESTA MÁQUINA, y la trampa menos obvia de todo esto:
#     pstore admite UN SOLO backend a la vez (fs/pstore/platform.c rechaza el
#     segundo con -EBUSY y "backend '%s' already loaded: ignoring '%s'").
#     Aquí efi_pstore ya está cargado y ES el backend activo (se comprueba en
#     /sys/module/pstore/parameters/backend). Sin esta línea, ramoops llegaría
#     tarde (se carga desde modules-load.d, en sysinit) y pstore lo rechazaría:
#     la reserva de RAM quedaría inútil y silenciosa.
#     Con backend=ramoops es el registro de efi_pstore el que se rechaza, sea
#     cual sea el orden de carga, así que el resultado es determinista.
#     Efecto colateral esperado y benigno: modprobe@efi_pstore.service puede
#     quedar en estado failed. No se pierde nada útil: efi_pstore guarda en la
#     NVRAM del firmware, con registros diminutos, y también necesita un panic
#     para escribir. Si no hay panic, ninguno de los dos graba nada; si hay
#     panic, ramoops da 16 MiB en vez de unos pocos KiB.
#
# pstore.kmsg_bytes=262144
#     Cuánta cola del log del kernel se copia en cada volcado. El default
#     compilado en este kernel es CONFIG_PSTORE_DEFAULT_KMSG_BYTES=10240, o sea
#     10 KiB: se queda corto en cuanto hay backtraces de 24 CPUs o una avalancha
#     de mensajes de AER/Thunderbolt. El parámetro es de solo lectura en runtime
#     (0444), así que SOLO se puede poner aquí, en la línea de comandos.
#     Va comprimido (CONFIG_PSTORE_COMPRESS=y), así que 256 KiB de texto caben de
#     sobra en un registro de 256 KiB.
#
# log_buf_len=1M
#     Agranda el buffer de dmesg del kernel (por defecto 2^18 = 256 KiB en este
#     kernel, CONFIG_LOG_BUF_SHIFT=18). Mantiene más historia viva ANTES del
#     cuelgue; sin esto, una avalancha de mensajes del enlace Thunderbolt puede
#     empujar fuera del buffer justo lo que queremos leer.
#
# NO se tocan `quiet` ni `splash`: solo afectan a lo que se IMPRIME en consola,
# no a lo que se guarda en el buffer del kernel, que es lo que vuelca ramoops.
# Si además quieres VER el panic en pantalla, añade `loglevel=7` (o quita splash)
# a mano en la entrada de GRUB; no es necesario para capturar el volcado.
#
# NO se añade crashkernel= ni se usa kdump: kdump no está instalado y pide
# reservar cientos de MiB y un initramfs de captura. ramoops da lo que hace
# falta aquí (el dmesg del momento de la muerte) a cambio de 16 MiB.
# ------------------------------------------------------------------------------

GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} reserve_mem=16M:4096:aorusoops ramoops.mem_name=aorusoops ramoops.record_size=262144 ramoops.max_reason=3 ramoops.ecc=1 pstore.backend=ramoops pstore.kmsg_bytes=262144 log_buf_len=1M"
