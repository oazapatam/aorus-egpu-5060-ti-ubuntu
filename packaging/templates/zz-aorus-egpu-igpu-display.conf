# aorus-egpu-igpu-display — el escritorio en la iGPU Intel, las dos NVIDIA para
# cómputo. Lo gestiona el .deb aorus-egpu-igpu-display. NO lo edites a mano.
#
# POR QUÉ ESTA PLANTILLA VIVE FUERA DEL ÁRBOL DEL PAQUETE:
# scripts/lib/bundle.sh::bundle_clean borra packaging/<pkg>/usr/share/aorus-egpu
# después de cada build, porque ahí es donde build-forensics.sh GENERA su copia
# del medidor de ancho de banda. Si esta plantilla viviera en su ruta final,
# el primer build la borraría y el segundo produciría un .deb sin ella — que es
# exactamente lo que pasó la primera vez: el postinst fallaba con
# "install: cannot stat '/usr/share/aorus-egpu/zz-...conf'".
# Así que es fuente aquí, y scripts/build-igpu-display.sh la instala en su sitio
# en tiempo de build, igual que forensics hace con tools/egpu-bandwidth.cu.
#
# Revertir el paquete:  sudo apt remove aorus-egpu-igpu-display && sudo reboot
#
# ------------------------------------------------------------------------------
# QUÉ HACE Y POR QUÉ
#
# nvidia_drm con modeset=1 registra un dispositivo KMS por cada GPU NVIDIA. En
# Wayland el compositor (aquí kwin_wayland) enumera TODOS los dispositivos KMS y
# conduce cualquier salida conectada que encuentre, así que acaba abriendo
# /dev/nvidia0, /dev/nvidiactl y /dev/nvidia-modeset. Consecuencias medidas en
# esta máquina el 2026-11-02:
#   - las GPUs NVIDIA quedan ocupadas en trabajo de pantalla en vez de cómputo;
#   - el driver no se puede descargar, porque el compositor lo retiene;
#   - `prime-select on-demand` NO evita esto: afecta al arranque de Xorg y a los
#     defaults de GLX, no a qué dispositivos KMS abre un compositor Wayland.
#     PRIME ya estaba en on-demand cuando se midió el problema.
#
# Con modeset=0 nvidia_drm no registra KMS: desaparecen las tarjetas DRM de las
# NVIDIA, el compositor sólo ve la Intel, y el driver queda libre. CUDA no se
# entera: el cómputo no usa KMS. Los render nodes siguen existiendo, así que
# PRIME render offload (__NV_PRIME_RENDER_OFFLOAD=1) sigue disponible.
#
# fbdev=0 es explícito por claridad: el framebuffer de consola de nvidia sólo
# tiene sentido con modeset=1, y no queremos que se active por un default futuro.
#
# EL NOMBRE IMPORTA. El prefijo zz- no es decorativo: en esta máquina hay otros
# dos ficheros que ponen modeset=1
#   /etc/modprobe.d/nvidia-graphics-drivers-kms.conf   (nvidia-driver-595)
#   /usr/lib/modprobe.d/nvidia-kms.conf                (nvidia-prime)
# y en los parámetros de módulo gana la ÚLTIMA asignación. Verificado con
# `modprobe --showconfig`: con el prefijo zz- esta línea sale en la posición 547,
# después de las dos de modeset=1 (536 y 539). Si alguien renombra este fichero
# a algo que ordene antes, el cambio deja de tener efecto EN SILENCIO.
#
# EL GATE. Si la iGPU no tuviera ninguna salida conectada, quitarle el KMS a
# NVIDIA dejaría la máquina sin ninguna pantalla, y eso no se descubre hasta
# después de reiniciar. Por eso el postinst sólo copia este fichero a
# /etc/modprobe.d/ si `aorus-egpu-display check` pasa, y por eso ese gate es una
# función pura con test (src/domain/display.sh, tests/run.sh).
# ------------------------------------------------------------------------------

options nvidia_drm modeset=0 fbdev=0
