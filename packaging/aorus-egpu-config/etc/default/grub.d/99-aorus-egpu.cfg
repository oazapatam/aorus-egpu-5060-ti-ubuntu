# aorus-egpu-config: kernel args for AORUS Thunderbolt eGPU BAR allocation.
# Managed by the aorus-egpu-config .deb. Do NOT edit by hand.
# Revert everything with:  sudo apt remove aorus-egpu-config
#
#   pci=realloc                   REQUIRED. Lets the kernel reassign BARs to the
#                                 eGPU behind the Thunderbolt bridge. Without it
#                                 the nvidia driver probe fails with
#                                 "BAR0 is 0M" and nvidia-smi never sees the GPU.
#                                 Never use pci=realloc=off (Fedora lo usa porque
#                                 arranca CON el eGPU; nosotros somos hotplug-only y
#                                 necesitamos realloc en el rescan del hotplug).
#
#   hpmmioprefsize=16G            ENUMERATION FIX (0.5.0). Reserva prefetchable MMIO
#                                 (sola basta; resource_alignment retirado en 0.5.1)
#                                 por puente HOTPLUG en el arranque. Diagnóstico en
#                                 vivo 2026-06-19: con el eGPU dormido al arrancar,
#                                 el puente TB intermedio (89:03.0) recibía solo
#                                 2 MiB prefetchable, mientras el root port TB
#                                 (80:1b.4) tenía 64 GiB libres. La BAR1 redimensio-
#                                 nable de 16 GiB de la RTX 5060 Ti NO cabe en 2 MiB
#                                 -> "bridge window ... can't assign; no space" ->
#                                 la GPU nunca enumera en b4:00.0 (config space all-Fs,
#                                 >TAbort+) aunque el enlace entrene sano (16GT/s x4).
#                                 Reservar 16 GiB en el puente hotplug deja sitio para
#                                 que la GPU quepa al enchufarla. (Al arrancar solo hay
#                                 ~2 puertos hotplug vacíos bajo el host TB -> ~32 GiB
#                                 de los 64 GiB, con margen.)
#
# REMOVED in 0.5.1:
#   resource_alignment=34@pci:10de:2d04
#                                 Pretendía dimensionar la ventana prefetchable del
#                                 puente a 16 GiB, PERO el parámetro mainline no apunta
#                                 a una sola BAR: alinea/INFLA *todas* las BAR del
#                                 device a 2^34 = 16 GiB. En vivo 2026-06-19 (0.5.0)
#                                 eso infló BAR0 (16 MB real) y la ROM a 16 GiB ->
#                                 "BAR 0 [mem size 0x400000000]: can't assign; no space"
#                                 -> nvidia ve "BAR0 is 0M @ 0x0" y el probe falla con
#                                 -1, la GPU enumera pero NO bindea. Innecesario además:
#                                 hpmmioprefsize=16G ya reserva la ventana de 16 GiB
#                                 (verificado: el puente tenía 16 GiB con el eGPU
#                                 dormido) y BAR1/BAR3 (16 G reales) se asignan solas.
#                                 Si la BAR1 cayera a 256 MiB (sin ReBAR; solo afecta
#                                 rendimiento, no correctitud), reintroducir alineación
#                                 SOLO si una forma BAR-específica está disponible.
#
# REMOVED in 0.4.1:
#   thunderbolt.host_reset=false  Fedora lo llama "THE KEY FIX" (preserva el layout
#                                 BAR1 del firmware al autorizar el túnel TB). PERO en
#                                 vivo 2026-06-19 colgó el reinicio en el handoff
#                                 kernel->firmware -> apagado forzado. Si la BAR1 cae a
#                                 256MiB al usar el eGPU, reevaluar reintroducirlo junto
#                                 con un reboot=efi/pci que sí sobreviva el handoff.
#
#   pcie_bus_perf                 PCIe MPS/MRRS a performance (baseline Fedora).
#
# REMOVED in 0.5.8 (REGRESIÓN DE FREEZE — revertido por decisión del usuario 2026-06-27):
#   iommu=pt                      Lo metió 0.5.6 para esquivar el "DMAR fault 0x71 Present
#                                 bit clear" que bloqueaba el bind. PERO el passthrough
#                                 QUITA la contención de DMA del IOMMU: con el enlace TB
#                                 entrenando MARGINAL (Gen1 2.5GT/s, GPU-side LnkSta
#                                 Active=N) el eGPU bindeaba y, segundos después, un acceso
#                                 de bus malo CONGELABA TODA LA MÁQUINA (hard-hang sin Xid
#                                 ni panic; el journal se cortaba en seco — boot -1 del
#                                 2026-06-27, 16:09:55). R4 intacto (la interna 01:00.0
#                                 nunca tomó Xid: el gate del driver funciona; el freeze es
#                                 del sistema, no de la GPU interna). Con IOMMU completo
#                                 (estado 0.5.1, VERIFICADO connect-sin-congelar) ese mismo
#                                 acceso se atrapaba como DMAR fault CONTENIDO. Trade-off
#                                 aceptado: sin iommu=pt el eGPU puede a veces NO bindear
#                                 (vuelve el DMAR fault 0x71), pero "no bindea" RESPETA R3
#                                 ("nunca congelar"); "bindea y congela" lo VIOLA. La causa
#                                 de fondo es el enlace Gen1 marginal, que ningún modo de
#                                 IOMMU arregla. NO reintroducir sin resolver antes el enlace.
#
#   pcie_aspm.policy=performance  ADDED 0.5.6. Desactivan ASPM/low-power en el enlace PCIe
#   thunderbolt.clx=0             y el controlador TB. Fedora: "prevents link retraining
#   pcie_port_pm=off              that freezes the TB tunnel". Root cause verificada en
#                                 vivo 2026-06-27: tras el LAST-CLOSE el puente TB
#                                 reentrena el enlace a Gen1 (2.5GT/s) y se CLAVA -> el
#                                 driver lo lee degradado -> Q-lever declara dead-bus en
#                                 falso -> DMA stale -> no-bind. Estos tres impiden que el
#                                 puente/controlador TB baje el enlace. Estaban ATRAPADOS
#                                 en 98-antifreeze.cfg.disabled junto a iommu=off; al
#                                 desactivar antifreeze los perdimos. Ahora van al baseline
#                                 SIN iommu=off Y SIN iommu=pt (IOMMU completo: el ASPM-off
#                                 evita el reentreno a Gen1 sin sacrificar la contención DMA).
#
# Siguen FUERA (rompen NUESTRA máquina, ver arriba): thunderbolt.host_reset=false (colgó
# el reboot, 0.4.1), resource_alignment (04:00.0 es el NVMe; infló BAR0, 0.5.1) e
# iommu=pt (congeló el PC con el enlace marginal, 0.5.8). BAR1 queda en 256 MiB (solo
# rendimiento) hasta resolver esos dos.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT pci=realloc,pcie_bus_perf,hpmmioprefsize=16G pcie_aspm.policy=performance thunderbolt.clx=0 pcie_port_pm=off"
