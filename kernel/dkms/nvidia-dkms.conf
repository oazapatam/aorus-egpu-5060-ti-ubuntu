# DKMS config for the patched NVIDIA 595.71.05 open kernel modules.
# Copied into /usr/src/aorus-nvidia-595.71.05-aorus17/ by build-nvidia-deb.sh.
# The reported module version is pinned to 595.71.05 (see version.mk) so it
# matches the stock userspace + GSP firmware; PACKAGE_VERSION is the deb/dkms
# revision and may carry the -aorus suffix without affecting NV_VERSION_STRING.
PACKAGE_NAME="aorus-nvidia"
PACKAGE_VERSION="595.71.05-aorus17"
AUTOINSTALL="yes"

# NOTE: the leading `env ` is load-bearing. DKMS rewrites a MAKE command that
# *starts with* `make` to inject `KERNELRELEASE=<kver>` as a command-line var,
# which propagates to the kernel-open sub-make and makes its Makefile take the
# `include $(src)/Kbuild` branch with $(src) empty -> "/Kbuild: No such file".
# Prefixing with `env` means the string no longer starts with `make`, so DKMS
# skips the injection and the build runs exactly like a bare `make modules`.
MAKE[0]="env make -j$(nproc) modules SYSSRC=${kernel_source_dir} KERNEL_UNAME=${kernelver} IGNORE_CC_MISMATCH=1"
CLEAN="env make clean"

BUILT_MODULE_NAME[0]="nvidia"
BUILT_MODULE_LOCATION[0]="kernel-open"
DEST_MODULE_LOCATION[0]="/updates/dkms"

BUILT_MODULE_NAME[1]="nvidia-uvm"
BUILT_MODULE_LOCATION[1]="kernel-open"
DEST_MODULE_LOCATION[1]="/updates/dkms"

BUILT_MODULE_NAME[2]="nvidia-modeset"
BUILT_MODULE_LOCATION[2]="kernel-open"
DEST_MODULE_LOCATION[2]="/updates/dkms"

BUILT_MODULE_NAME[3]="nvidia-drm"
BUILT_MODULE_LOCATION[3]="kernel-open"
DEST_MODULE_LOCATION[3]="/updates/dkms"

BUILT_MODULE_NAME[4]="nvidia-peermem"
BUILT_MODULE_LOCATION[4]="kernel-open"
DEST_MODULE_LOCATION[4]="/updates/dkms"
